<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simple Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
          <h1>Simple Chat</h1>
          <span>GPT-4.1 Nano</span>
        </div>
      </div>

      <button
        id="settingsBtn"
        class="icon-button"
        type="button"
        aria-label="Open settings"
        title="Settings"
      >
        ⚙
      </button>
    </header>


    <!-- Chat -->
    <main class="chat-area">

      <div id="welcome" class="welcome">
        <div class="welcome-icon">✦</div>
        <h2>How can I help?</h2>
        <p>Start a conversation below.</p>
      </div>

      <div
        id="messages"
        class="messages"
        aria-live="polite"
      ></div>

    </main>


    <!-- Chat Input -->
    <footer class="input-area">
      <form id="chatForm" class="chat-form">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message..."
          autocomplete="off"
          aria-label="Message"
        ></textarea>

        <button
          id="sendBtn"
          class="send-button"
          type="submit"
          aria-label="Send message"
          title="Send"
        >
          ↑
        </button>

      </form>

      <p class="input-note">
        Powered by Replicate
      </p>
    </footer>

  </div>


  <!-- Settings Dialog -->
  <dialog id="settingsDialog" class="settings-dialog">

    <div class="dialog-header">
      <div>
        <h2>Settings</h2>
        <p>Configure your chat connection.</p>
      </div>

      <button
        id="closeSettingsBtn"
        class="close-button"
        type="button"
        aria-label="Close settings"
      >
        ×
      </button>
    </div>


    <form id="settingsForm" class="settings-form">

      <!-- API Token -->
      <div class="form-group">
        <label for="apiToken">
          Replicate API Token
        </label>

        <input
          id="apiToken"
          name="apiToken"
          type="password"
          placeholder="r8_..."
          autocomplete="off"
          spellcheck="false"
        >

        <small>
          Your token is stored only in this browser.
        </small>
      </div>


      <!-- System Prompt -->
      <div class="form-group">
        <label for="systemPrompt">
          System Prompt
          <span>(Optional)</span>
        </label>

        <textarea
          id="systemPrompt"
          name="systemPrompt"
          rows="6"
          placeholder="You are a helpful assistant..."
          spellcheck="true"
        ></textarea>

        <small>
          This instruction will be sent with every message.
        </small>
      </div>


      <!-- Settings Actions -->
      <div class="settings-actions">

        <button
          id="cancelSettingsBtn"
          class="secondary-button"
          type="button"
        >
          Cancel
        </button>

        <button
          class="primary-button"
          type="submit"
        >
          Save Settings
        </button>

      </div>

    </form>

  </dialog>


  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
